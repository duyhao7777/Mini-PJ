   adventureworks_dw:
     target: dev
     outputs:
       dev:
         type: sqlserver
         driver: 'ODBC Driver 18 for SQL Server'
         server: "{{ env_var('DBT_SERVER', 'localhost') }}"
         port: 1433
         database: BI_AdventureWorks
         schema: dw
         user: sa
         password: "{{ env_var('DBT_SA_PASSWORD') }}"
         encrypt: true
         trust_cert: true
         threads: 4